name: Release — instaladores multiplataforma

# Construye los instaladores de eMail-IA en los tres sistemas y los sube
# al release de GitHub (tag) o como artefactos descargables (manual).
# Cada runner genera su JRE jlink nativo → artefactos autosuficientes.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # ── Linux: AppImage + deb (x64) ────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Frontend build
        run: cd frontend && pnpm install --ignore-scripts --frozen-lockfile && pnpm build

      - name: Backend package (embebe frontend en el jar)
        run: cd backend && mvn package -DskipTests -q

      - name: JRE jlink + electron-builder (AppImage + deb)
        run: |
          cd electron
          npm install
          npm run dist:linux

      - name: RPM (spec propio, no fpm)
        run: |
          sudo apt-get install -y rpm
          bash lanzadores/linux/deb-rpm/build-rpm.sh

      - name: Checksums
        run: |
          cd electron/release
          sha256sum *.AppImage *.deb rpm/RPMS/x86_64/*.rpm > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: linux-instaladores
          path: |
            electron/release/*.AppImage
            electron/release/*.deb
            electron/release/rpm/RPMS/x86_64/*.rpm
            electron/release/SHA256SUMS.txt
          if-no-files-found: error

  # ── Windows: NSIS (x64) ────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Frontend build
        run: cd frontend && pnpm install --ignore-scripts --frozen-lockfile && pnpm build

      - name: Backend package (embebe frontend en el jar)
        run: cd backend && mvn package -DskipTests -q

      - name: JRE jlink + electron-builder (NSIS)
        shell: bash
        run: |
          cd electron
          npm install
          bash build-jre.sh
          npx tsc
          npx electron-builder --win nsis

      - name: Checksums
        shell: bash
        run: cd electron/release && sha256sum *.exe > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-instaladores
          path: |
            electron/release/*.exe
            electron/release/SHA256SUMS.txt
          if-no-files-found: error

  # ── macOS: DMG (x64 + arm64) ───────────────────────────────────
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Frontend build
        run: cd frontend && pnpm install --ignore-scripts --frozen-lockfile && pnpm build

      - name: Backend package (embebe frontend en el jar)
        run: cd backend && mvn package -DskipTests -q

      - name: JRE jlink + electron-builder (DMG arm64 — Apple Silicon)
        run: |
          cd electron
          npm install
          bash build-jre.sh
          npx tsc
          npx electron-builder --mac dmg --arm64

      - name: Checksums
        run: cd electron/release && shasum -a 256 *.dmg > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: macos-instaladores
          path: |
            electron/release/*.dmg
            electron/release/SHA256SUMS.txt
          if-no-files-found: error

  # ── Publicar al release (solo en tags) ─────────────────────────
  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos/

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artefactos/**/*
