name: CI — eMail-IA

on:
  push:
    branches: [development, main, 'feature/**']
  pull_request:
    branches: [development, main]

jobs:
  # ── Backend ──────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Backend tests
        run: cd backend && mvn test

      - name: Backend package
        run: cd backend && mvn package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/emailai-backend-*.jar

  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Frontend tests
        run: |
          cd frontend
          pnpm install --ignore-scripts
          pnpm test

      - name: Frontend build
        run: |
          cd frontend
          pnpm build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ── Electron ─────────────────────────────────────────────────
  electron:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target/

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Electron build
        run: |
          cd electron
          npm install
          npm run build

      - name: Upload Electron dist
        uses: actions/upload-artifact@v4
        with:
          name: electron-dist
          path: electron/dist/

  # ── Package (solo en main y etiquetas) ───────────────────────
  package:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [electron]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Electron build + package
        run: |
          cd electron
          npm install
          npm run build
          npx electron-builder build --linux

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: electron/release/
