# Configuración principal de eMail-IA Backend
# H2 cifrada vía DatabaseConfig (@Bean), Flyway para migraciones.
# Frontend sirve desde ../frontend/dist/ (build) o classpath:/static/.
spring:
  application:
    name: emailai-backend

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway crea esquema; Hibernate solo valida
    properties:
      hibernate:
        format_sql: true
    open-in-view: false  # Sin sesiones lazy en controllers

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  flyway:
    enabled: true
    locations: classpath:db/migration

  web:
    resources:
      static-locations: file:../frontend/dist/, classpath:/static/

server:
  port: 8080

# Configuración de la app
emailai:
  data-dir: DB
  debug:
    enabled: false  # DebugController solo se carga con emailai.debug.enabled=true
  ai:
    base-url: ${EMAILAI_AI_BASE_URL:http://localhost:1234}  # LM Studio
    model: ${EMAILAI_AI_MODEL:qwen3.5:9b}
    timeout: 30
  todoist:
    api-key: ${EMAILAI_TODOIST_API_KEY:}
  oauth:
    google:
      client-id: ${EMAILAI_GOOGLE_CLIENT_ID:}
      client-secret: ${EMAILAI_GOOGLE_CLIENT_SECRET:}
    microsoft:
      client-id: ${EMAILAI_MICROSOFT_CLIENT_ID:}
      client-secret: ${EMAILAI_MICROSOFT_CLIENT_SECRET:}
  security:
    jwt:
      # Sin fallback: si no hay EMAILAI_JWT_SECRET, JwtService genera y persiste en data-dir/jwt.key
      secret: ${EMAILAI_JWT_SECRET:}
      expiration-hours: 24

logging:
  level:
    org.hibernate.SQL: warn
    com.emailai: info
    com.github.fommil: error  # Silenciar ARPACK (Weka)
