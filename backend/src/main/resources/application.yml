spring:
  application:
    name: emailai-backend

  # DataSource configurado por DatabaseConfig (@Bean) con H2 cifrada (CIPHER=AES).
  # No se define spring.datasource aquí para no interferir con el bean personalizado.

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway crea el esquema; Hibernate solo valida
    properties:
      hibernate:
        format_sql: true
    open-in-view: false           # Evita sesiones lazy abiertas en el controller

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  flyway:
    enabled: true
    locations: classpath:db/migration

  web:
    resources:
      static-locations: file:../frontend/dist/, classpath:/static/

server:
  port: 8080

# Configuración de la app
emailai:
  data-dir: DB                    # Directorio de datos locales (H2, cipher.key)
  ai:
    base-url: ${EMAILAI_AI_BASE_URL:http://localhost:1234}
    model: ${EMAILAI_AI_MODEL:qwen3.5:9b}
    timeout: 30
  todoist:
    api-key: ${EMAILAI_TODOIST_API_KEY:}
  security:
    jwt:
      secret: ${EMAILAI_JWT_SECRET:emailai-local-session-key-2026}
      expiration-hours: 24

logging:
  level:
    org.hibernate.SQL: warn
    com.emailai: info
