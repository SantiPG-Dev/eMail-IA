appId: com.emailai.desktop
productName: eMail-IA
copyright: Copyright © 2026 SantiPG-Dev

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - assets/**/*
  - splash.html

icon: assets/icon-256.png

# JRE dedicado montado con jlink (build-jre.sh) → sin dependencia del Java
# del sistema. Si electron/jre/ no existe, compilarlo antes de empaquetar
# (npm run dist:linux lo hace automáticamente).
extraResources:
  - from: ../backend/target/emailai-backend-1.0.0.jar
    to: backend.jar
  - from: jre
    to: jre

mac:
  category: public.app-category.productivity
  # Solo arm64 (Apple Silicon): el JRE jlink se genera en el runner y no
  # puede cross-compilar. dmg x64 necesitaría un runner Intel (macos-13)
  # con su propio JRE — pendiente si hay demanda.
  target:
    - target: dmg
      arch: [arm64]
  hardenedRuntime: true
  artifactName: ${name}-${version}-${arch}.${ext}

linux:
  category: Office
  maintainer: Santiago Pérez Gómez <SantiPG-Dev@gmx.com>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  # El rpm se monta vía lanzadores/linux/deb-rpm/build-rpm.sh + spec propio.
  # fpm 1.9.3 (el que trae) se rompe con rpmbuild moderno (bug builddir/BUILDROOT:
  # reporta todos los ficheros como "File not found"). Con spec a mano se evita.
  artifactName: ${name}-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${name}-${version}-${arch}.${ext}
