appId: com.emailai.desktop
productName: eMail-IA
copyright: Copyright © 2026 Santiago Pérez Gómez

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - assets/**/*

icon: assets/icon-256.png

# Sin JRE empaquetado: la app asume Java 21 en el PATH del sistema.
# Para distribuir sin depender de Java, montar un JRE con jlink y descomentar jre/.
extraResources:
  - from: ../backend/target/emailai-backend-1.0.0.jar
    to: backend.jar

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
  hardenedRuntime: true
  artifactName: ${name}-${version}-${arch}.${ext}

linux:
  category: Office
  maintainer: Santiago Pérez Gómez <SantiPG-Dev@gmx.com>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  # El rpm se monta vía build-rpm.sh + emailai-electron.spec propio.
  # fpm 1.9.3 (el que trae) se rompe con rpmbuild moderno (bug builddir/BUILDROOT:
  # reporta todos los ficheros como "File not found"). Con spec a mano se evita.
  artifactName: ${name}-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${name}-${version}-${arch}.${ext}
