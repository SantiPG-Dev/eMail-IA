appId: com.emailai.desktop
productName: eMail-IA
copyright: Copyright © 2026 Santiago Pérez Gómez

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - assets/**/*

icon: assets/icon-256.png

extraResources:
  - from: ../backend/target/emailai-backend-1.0-SNAPSHOT.jar
    to: backend.jar
  - from: jre/
    to: jre/
    filter:
      - "**/*"

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
  hardenedRuntime: true
  artifactName: ${name}-${version}-${arch}.${ext}

linux:
  category: Office
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: ${name}-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${name}-${version}-${arch}.${ext}
