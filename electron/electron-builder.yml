appId: com.emailai.desktop
productName: eMail-IA
copyright: Copyright © 2026 Santiago Pérez Gómez

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - assets/**/*

icon: assets/icon-256.png

# sin JRE empaquetado — la app asume Java 21 en el PATH del sistema.
# Para distribuir sin dependencia de Java, bundle JRE con jlink y descomentar la entrada jre/.
extraResources:
  - from: ../backend/target/emailai-backend-1.0-SNAPSHOT.jar
    to: backend.jar

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
  hardenedRuntime: true
  artifactName: ${name}-${version}-${arch}.${ext}

linux:
  category: Office
  maintainer: Santiago Pérez Gómez <santiago@example.com>  # cámbialo por tu email real antes de publicar
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: ${name}-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${name}-${version}-${arch}.${ext}
